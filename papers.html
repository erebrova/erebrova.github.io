let currentView = "newest";
let currentTopic = "all";
const topicMap = new Map(topics.map(topic => [topic.id, topic.label]));
const venueTypeMap = new Map(venueTypes.map(type => [type.id, type.label]));
const root = document.getElementById("paper-root");
const topicSelect = document.getElementById("topic-select");
const count = document.getElementById("paper-count");

topics.forEach(topic => {
    const option = document.createElement("option");
    option.value = topic.id;
    option.textContent = topic.label;
    topicSelect.appendChild(option);
});

document.querySelectorAll(".view-button").forEach(button => {
    button.addEventListener("click", () => {
        currentView = button.dataset.view;
        document.querySelectorAll(".view-button").forEach(item => item.classList.toggle("active", item === button));
        render();
    });
});

topicSelect.addEventListener("change", () => {
    currentTopic = topicSelect.value;
    render();
});

function sortedPapers(items) {
    return [...items].sort((a, b) => b.year - a.year);
}

function venueTypeOf(paper) {
    if (paper.venueType) return paper.venueType;
    const venue = paper.venue.toLowerCase();
    if (paper.title.toLowerCase().includes("thesis") || venue.includes("university of michigan")) return "survey";
    if (venue.includes("submitted") || venue.includes("arxiv preprint")) return "preprint";
    if (venue.includes("proc.") || venue.includes("conference") || venue.includes("symposium") || venue.includes("workshop")) return "conference";
    return "journal";
}

function filteredPapers() {
    return papers.filter(paper => {
        return currentTopic === "all" || paper.tags.includes(currentTopic);
    });
}

function paperCard(paper) {
    const article = document.createElement("article");
    article.className = "paper-card";

    const title = document.createElement("div");
    title.className = "paper-title";
    title.textContent = paper.title;
    article.appendChild(title);

    const authors = document.createElement("div");
    authors.className = "paper-meta";
    authors.textContent = paper.authors;
    article.appendChild(authors);

    const venue = document.createElement("div");
    venue.className = "paper-venue";
    venue.textContent = `${paper.year} · ${paper.venue}`;
    article.appendChild(venue);

    let bibtexBlock;
    if ((paper.resources && paper.resources.length) || paper.bibtex) {
        const resources = document.createElement("div");
        resources.className = "resource-links";
        (paper.resources || []).forEach(resource => {
            const link = document.createElement("a");
            link.className = "resource-link";
            link.href = resource.url;
            link.textContent = resource.label;
            resources.appendChild(link);
        });

        if (paper.bibtex) {
            const bibtexButton = document.createElement("button");
            bibtexButton.className = "resource-link bibtex-toggle";
            bibtexButton.type = "button";
            bibtexButton.textContent = "BibTeX";
            bibtexButton.addEventListener("click", () => {
                const expanded = bibtexButton.getAttribute("aria-expanded") === "true";
                bibtexButton.setAttribute("aria-expanded", String(!expanded));
                bibtexBlock.hidden = expanded;
            });
            resources.appendChild(bibtexButton);
        }

        article.appendChild(resources);
    }

    if (paper.bibtex) {
        bibtexBlock = document.createElement("pre");
        bibtexBlock.className = "bibtex-block";
        bibtexBlock.hidden = true;
        bibtexBlock.textContent = paper.bibtex;
        article.appendChild(bibtexBlock);
    }

    const topicLine = document.createElement("div");
    topicLine.className = "paper-topics";
    topicLine.textContent = `Topics: ${paper.tags.map(tag => topicMap.get(tag)).join(" · ")}`;
    article.appendChild(topicLine);

    return article;
}

function renderList(items) {
    const fragment = document.createDocumentFragment();
    sortedPapers(items).forEach(paper => fragment.appendChild(paperCard(paper)));
    root.appendChild(fragment);
}

function renderGroupedByTopic(items) {
    const selectedTopics = currentTopic === "all" ? topics.filter(topic => topic.id !== "all") : [topics.find(topic => topic.id === currentTopic)];
    selectedTopics.forEach(topic => {
        const groupItems = sortedPapers(items.filter(paper => paper.topic === topic.id));
        if (!groupItems.length) return;

        const section = document.createElement("section");
        section.className = "topic-group";

        const heading = document.createElement("h2");
        heading.className = "topic-heading";
        heading.textContent = topic.label;
        section.appendChild(heading);

        const list = document.createElement("div");
        list.className = "paper-list";
        groupItems.forEach(paper => list.appendChild(paperCard(paper)));
        section.appendChild(list);
        root.appendChild(section);
    });
}

function renderGroupedByVenue(items) {
    const selectedTypes = venueTypes.filter(type => type.id !== "all");
    selectedTypes.forEach(type => {
        const groupItems = sortedPapers(items.filter(paper => venueTypeOf(paper) === type.id));
        if (!groupItems.length) return;

        const section = document.createElement("section");
        section.className = "topic-group";

        const heading = document.createElement("h2");
        heading.className = "topic-heading";
        heading.textContent = type.label;
        section.appendChild(heading);

        const list = document.createElement("div");
        list.className = "paper-list";
        groupItems.forEach(paper => list.appendChild(paperCard(paper)));
        section.appendChild(list);
        root.appendChild(section);
    });
}

function render() {
    const items = filteredPapers();
    root.innerHTML = "";
    if (currentView === "topic") {
        renderGroupedByTopic(items);
    } else if (currentView === "venue") {
        renderGroupedByVenue(items);
    } else {
        renderList(items);
    }
    const topicLabel = currentTopic === "all" ? "all topics" : topicMap.get(currentTopic);
    count.textContent = `${items.length} papers · ${topicLabel}`;
}

render();
